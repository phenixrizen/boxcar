name: review

# Claude Code reviews a pull request when it is opened ready, marked ready,
# or pushed to while ready. It needs a CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`) or ANTHROPIC_API_KEY repository secret; without one,
# or on a fork's pull request, the job ends green without reviewing. Its
# comments are advice for the author and the owner: only `required-checks`
# in ci.yml gates a merge. To review once per pull request instead of after
# every push, drop `synchronize` from the types.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Credential present
        id: credential
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret: no review."
          fi

      - if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - if: steps.credential.outputs.present == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first. Look for bugs,
            broken invariants, changed behavior without a test, and unsafe
            handling of input; leave style alone. The PR branch is checked
            out in the working directory.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) on the lines concerned, and `gh pr comment`
            for one short summary. Only post GitHub comments. Do not
            approve, request changes or merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 40
