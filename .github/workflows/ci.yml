name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the single source of truth for the compiler
      # version. dtolnay/rust-toolchain does not read it, so read the channel
      # here and hand it over.
      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          # Keep in step with components and targets in rust-toolchain.toml.
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: License and dependency policy
        run: cargo deny check

      - name: Static musl guest init
        run: cargo build -p boxcar-init --target x86_64-unknown-linux-musl --profile guest
