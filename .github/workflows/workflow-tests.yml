name: workflow tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
