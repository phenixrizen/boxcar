[package]
name = "boxcar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
kvm-tests = []

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
boxcar-proto = { workspace = true, features = ["hash"] }
boxcar-audit = { workspace = true }
boxcar-vmm = { workspace = true }
boxcar-fs = { workspace = true }
fuse-backend-rs = { workspace = true }
boxcar-net = { workspace = true }
# Policy files and the built-in profiles (`run --policy`, `policy profile`).
boxcar-policy = { workspace = true }
# The gated tests' extra upstream roots are certificates (`--features kvm-tests`).
rustls-pki-types = { workspace = true }
boxcar-vsock = { workspace = true }
arc-swap = { workspace = true }
# OCI images (`boxcar image`, M5): the registry client, the store and the
# unpacker.
ureq = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
tempfile = { workspace = true }
# The M4 gated tests run a TLS stub on the loopback for the gate to reach.
rcgen = { workspace = true }
# The in-process registry the image tests pull from.
boxcar-testreg = { workspace = true }
