[package]
name = "boxcar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
kvm-tests = []

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
boxcar-proto = { workspace = true, features = ["hash"] }
boxcar-audit = { workspace = true }
boxcar-vmm = { workspace = true }
boxcar-fs = { workspace = true }
boxcar-net = { workspace = true }
# The gated tests' extra upstream roots are certificates (`--features kvm-tests`).
rustls-pki-types = { workspace = true }
boxcar-vsock = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
tempfile = { workspace = true }
# The M4 gated tests run a TLS stub on the loopback for the gate to reach.
rustls = { workspace = true }
rcgen = { workspace = true }
