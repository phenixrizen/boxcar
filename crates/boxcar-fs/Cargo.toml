[package]
name = "boxcar-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
boxcar-proto = { workspace = true, features = ["hash"] }
boxcar-audit = { workspace = true }
boxcar-virtio = { workspace = true }
fuse-backend-rs = { workspace = true }
vm-memory = { workspace = true }
virtio-queue = { workspace = true }
virtio-bindings = { workspace = true }
vmm-sys-util = { workspace = true }
event-manager = { workspace = true }
blake3 = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `boxcar_virtio::testing`: guest memory and register helpers, so the
# device tests drive the virtio-fs device through a transport without KVM.
boxcar-virtio = { workspace = true, features = ["testing"] }
# Pin-set canary: it must resolve against the same virtio-queue and vm-memory
# as fuse-backend-rs, so a pin change that splits those types fails here.
virtio-vsock = { workspace = true }
# Same exact pin as [dependencies]; `test-utils` only adds the `mock` module
# the canary builds its descriptor chain with, and only for test builds.
virtio-queue = { workspace = true, features = ["test-utils"] }
