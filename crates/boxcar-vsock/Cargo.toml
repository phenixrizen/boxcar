[package]
name = "boxcar-vsock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
boxcar-proto = { workspace = true, features = ["hash"] }
boxcar-audit = { workspace = true }
# The `VirtioDevice` trait, `IrqTrigger`, and `boxcar_virtio::limited!`,
# which keeps guest-triggerable log lines to one a second.
boxcar-virtio = { workspace = true }
virtio-vsock = { workspace = true }
vm-memory = { workspace = true }
virtio-queue = { workspace = true }
virtio-bindings = { workspace = true }
vmm-sys-util = { workspace = true }
event-manager = { workspace = true }
# shutdown(2) on the host end of a connection, and the socket's mode.
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The tests read the `vsock.*` records' data.
serde_json = { workspace = true }
# `boxcar_virtio::testing`: guest memory and register helpers, so the
# device tests drive the virtio-vsock device through a transport without
# KVM.
boxcar-virtio = { workspace = true, features = ["testing"] }
# Same exact pin as [dependencies]; `test-utils` only adds the `mock` module
# the device tests build their rings with, and only for test builds.
virtio-queue = { workspace = true, features = ["test-utils"] }
