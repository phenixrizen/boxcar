[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# The eBPF programs build for bpfel-unknown-none on a pinned nightly, through
# boxcar-sensor's build.rs: a crate of their own, with their own lock file,
# so the stable `--workspace` commands never touch them.
exclude = ["crates/boxcar-sensor-ebpf"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/phenixrizen/boxcar"

[workspace.dependencies]
# Internal crates. boxcar-proto is declared without default features because
# cargo ignores `default-features = false` on a member that inherits a
# workspace dependency unless the workspace entry says it too. That keeps
# `blake3` (which builds C code) out of the static musl guest init; host-side
# crates opt in with `features = ["hash"]`.
boxcar-proto = { path = "crates/boxcar-proto", default-features = false }
boxcar-audit = { path = "crates/boxcar-audit" }
boxcar-virtio = { path = "crates/boxcar-virtio" }
boxcar-fs = { path = "crates/boxcar-fs" }
boxcar-vmm = { path = "crates/boxcar-vmm" }
boxcar-net = { path = "crates/boxcar-net" }
boxcar-vsock = { path = "crates/boxcar-vsock" }
boxcar-sensor-common = { path = "crates/boxcar-sensor-common" }

# rust-vmm and fuse-backend-rs: exact pins, one coherent vm-memory 0.17 set.
# crates.io only: no git dependencies and no [patch] sections.
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-atomic"] }
virtio-queue = "=0.17.0"
virtio-bindings = "=0.2.7"
virtio-vsock = "=0.11.0"
fuse-backend-rs = { version = "=0.14.0", default-features = false, features = ["virtiofs"] }
kvm-ioctls = "=0.25.0"
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
linux-loader = { version = "=0.13.2", default-features = false, features = ["elf"] }
vm-superio = "=0.8.2"
event-manager = "=0.4.2"
vm-allocator = "=0.1.4"
vmm-sys-util = "=0.15.0"

blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v7", "serde"] }
hex = "0.4"
base64 = "0.22"
libc = "0.2"
thiserror = "2"
anyhow = "1"   # binaries and xtask only
nix = "0.31"   # guest only
cpio = "0.4"   # xtask only
tempfile = "3" # dev only

# The user-mode network stack (boxcar-net).
# The guest sensor (M3): aya loads the eBPF programs in the guest, aya-build
# builds them from boxcar-sensor's build.rs, aya-obj parses the built object
# on the host for the eBPF lane's checks.
aya = "0.14"
aya-obj = "0.3"
aya-build = "0.2"

# The model traffic gate (M4): rustls on the `ring` provider for both TLS
# legs, rcgen for the session CA and its leaves, ring's digest for the CA's
# fingerprint. `aws-lc-sys` stays banned (deny.toml); ring builds C and
# assembly through `cc` on the host only, as blake3 does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
# The host's trust store, for the upstream leg.
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# The HTTP observer: HTTP/1.1 heads, HPACK for HTTP/2, and the content
# codings it decodes (gzip and deflate through flate2's pure-Rust backend,
# brotli through brotli-decompressor).
httparse = "1"
fluke-hpack = "0.3"
flate2 = "1.1"
brotli-decompressor = { version = "6", default-features = false, features = ["std"] }
# Certificate validity (rcgen takes `time` types); the PEM is written here.
time = { version = "0.3", default-features = false, features = ["std"] }

smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-udp", "socket-raw"] }
socket2 = { version = "0.5", features = ["all"] }
arc-swap = "1"
proptest = "1" # dev only
# JSON Schema generation (`cargo xtask schema`); boxcar-proto's optional
# `schema` feature, on only for xtask.
schemars = "0.8"

# Static musl guest init: `cargo build -p boxcar-init --target
# x86_64-unknown-linux-musl --profile guest`.
[profile.guest]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
